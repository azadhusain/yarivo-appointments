name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'playwright-edge-tests/package-lock.json'

      - name: Install dependencies
        working-directory: playwright-edge-tests
        run: npm ci || npm install

      - name: Install Playwright Browsers
        working-directory: playwright-edge-tests
        run: npx playwright install --with-deps

      - name: Run Playwright Tests (Smoke, Regression, Edge)
        working-directory: playwright-edge-tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000/api/v1

      - name: Upload HTML Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-edge-tests/playwright-report/
          retention-days: 30

      - name: Upload Test Results & Traces
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: playwright-edge-tests/test-results/
          retention-days: 14
